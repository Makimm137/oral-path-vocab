<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>口腔专业英语 · 背单词</title>

<style>
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --primary:#007aff;
  --warn:#ff9f0a;
  --soft:#e8f3ff;
  --line:#e8e8ed;
  --text:#1d1d1f;
  --sub:#6e6e73;
  --radius:8px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#f4f8fb 0%,var(--bg) 52%,#f7f7f9 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
}
.container{max-width:900px;margin:0 auto;padding:20px}
.card{
  background:var(--card);
  border:1px solid rgba(0,0,0,.04);
  border-radius:var(--radius);
  padding:34px 28px;
  box-shadow:0 18px 45px rgba(20,42,70,.10);
}

.stat{
  text-align:center;
  font-size:18px;
  color:var(--sub);
  margin-bottom:8px;
}

.word{
  font-family:"Times New Roman",serif;
  font-size:72px;
  text-align:center;
  line-height:1.08;
  overflow-wrap:anywhere;
  cursor:pointer;
  transition:letter-spacing .22s ease, transform .22s ease;
}
.word.split{
  letter-spacing:.02em;
}
.word-token,
.syllable,
.phoneme{
  display:inline-block;
}
.syllable{
  margin:0 .08em;
  animation:splitIn .22s ease both;
}
.phoneme{
  margin:0 .045em;
  animation:splitIn .22s ease both;
}
.word-gap{
  display:inline-block;
  width:.3em;
}
.letter-vowel{
  color:#e53935;
}
.letter-consonant{
  color:#0b63ce;
}
@keyframes splitIn{
  from{
    opacity:.45;
    transform:translateY(4px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
.phonetic{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:6px;
  color:var(--sub);
}
.phonetic button{
  font-size:24px;
  width:46px;
  height:46px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:none;
  border-radius:50%;
  background:var(--soft);
  cursor:pointer;
  line-height:0;
  color:#0b5cad;
}
.speaker-icon{
  width:28px;
  height:24px;
  display:inline-block;
  position:relative;
  transform:translate(-8px,-1px);
}
.speaker-core{
  position:absolute;
  left:2px;
  top:7px;
  width:8px;
  height:9px;
  border-radius:2px 0 0 2px;
  background:currentColor;
}
.speaker-core::after{
  content:"";
  position:absolute;
  left:7px;
  top:-5px;
  width:0;
  height:0;
  border-top:10px solid transparent;
  border-bottom:10px solid transparent;
  border-left:11px solid currentColor;
}
.speaker-wave{
  position:absolute;
  top:50%;
  border:2px solid currentColor;
  border-left:none;
  border-top-color:transparent;
  border-bottom-color:transparent;
  border-radius:50%;
  transform:translateY(-50%);
}
.speaker-wave.one{
  left:16px;
  width:7px;
  height:12px;
}
.speaker-wave.two{
  left:20px;
  width:10px;
  height:18px;
}
.phonetic-text{
  font-family:"Times New Roman",serif;
  font-size:18px;
  line-height:1.4;
  max-width:70%;
  overflow-wrap:anywhere;
}
.meaning{
  margin-top:26px;
  font-size:32px;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  text-align:center;
  background:#fafafa;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  line-height:1.35;
}
.note{
  margin-top:14px;
  text-align:center;
  color:var(--sub);
  font-size:17px;
}
.note span{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:4px 12px;
  border-radius:999px;
  background:var(--soft);
  color:#0b5cad;
}
.controls{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:32px;
}
.btn{
  min-width:120px;
  padding:14px 22px;
  border-radius:12px;
  font-size:18px;
  border:none;
  cursor:pointer;
  font-weight:600;
}
.prev{background:#e5e5ea}
.unknown{background:#ff9f0a;color:#fff}
.known{background:#007aff;color:#fff}

.footer{
  margin-top:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  color:#6e6e73;
}
.footer > div:last-child{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}
.footer button:not(.link-count){
  min-height:40px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  cursor:pointer;
  padding:8px 12px;
}
.link-count{
  padding:0;
  border:none;
  background:none;
  color:#007aff;
  font:inherit;
  cursor:pointer;
}
.link-count:hover{
  text-decoration:underline;
}

/* ===== 悬浮窗 ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.modal-content{
  background:#fff;
  width:90%;
  max-width:900px;
  max-height:80vh;
  overflow:auto;
  border-radius:var(--radius);
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.22);
}
.modal h2{
  margin:0 0 12px;
  text-align:center;
  font-size:22px;
}
.modal-tools{
  position:sticky;
  top:0;
  background:#fff;
  padding:8px 0 12px;
  z-index:2;
}
.search{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 14px;
  font-size:16px;
  outline:none;
}
.search:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(0,122,255,.12);
}
.close{
  position:sticky;
  top:0;
  float:right;
  cursor:pointer;
  font-size:18px;
  width:34px;
  height:34px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#f2f2f7;
}

/* ===== 表格 ===== */
table{
  width:100%;
  border-collapse:collapse;
  font-size:16px;
}
th,td{
  padding:8px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
}
th{
  background:#fafafa;
}
td.en{
  font-family:"Times New Roman",serif;
  overflow-wrap:anywhere;
}
td.cn{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  overflow-wrap:anywhere;
}

@media(max-width:600px){
  body{
    background:var(--card);
  }
  .container{
    min-height:100svh;
    padding:10px;
    display:flex;
    align-items:stretch;
  }
  .card{
    width:100%;
    min-height:calc(100svh - 20px);
    padding:22px 16px 18px;
    box-shadow:none;
    display:flex;
    flex-direction:column;
  }
  .stat{
    font-size:14px;
    line-height:1.5;
  }
  .word{
    margin-top:auto;
    font-size:clamp(34px,12vw,52px);
  }
  .syllable{
    margin:0 .055em;
  }
  .phoneme{
    margin:0 .035em;
  }
  .phonetic{
    gap:8px;
  }
  .phonetic button{
    width:42px;
    height:42px;
    font-size:20px;
    flex:0 0 auto;
  }
  .speaker-icon{
    width:26px;
    height:23px;
  }
  .phonetic-text{
    max-width:calc(100% - 52px);
    font-size:15px;
  }
  .meaning{
    margin-top:20px;
    font-size:clamp(22px,7vw,28px);
    padding:16px 12px;
  }
  .note{
    font-size:14px;
  }
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:auto;
    padding-top:28px;
  }
  .btn{
    min-width:0;
    width:100%;
    min-height:52px;
    padding:12px 10px;
    font-size:17px;
  }
  .prev{
    grid-column:1 / -1;
    order:3;
  }
  .footer{
    margin-top:18px;
    gap:12px;
    font-size:14px;
  }
  .footer > div:last-child{
    width:100%;
  }
  .footer button:not(.link-count){
    flex:1 1 calc(50% - 5px);
    min-height:42px;
    padding:8px 10px;
    font-size:14px;
  }
  .footer button:not(.link-count):first-child{
    flex-basis:100%;
  }
  .modal{
    align-items:flex-end;
    background:rgba(0,0,0,.28);
  }
  .modal-content{
    width:100%;
    max-height:88svh;
    overflow-x:hidden;
    border-radius:var(--radius) var(--radius) 0 0;
    padding:14px 12px 18px;
  }
  .modal h2{
    padding:0 42px;
    font-size:18px;
    line-height:1.4;
  }
  .search{
    height:44px;
    font-size:16px;
  }
  table{
    width:100%;
    table-layout:fixed;
    font-size:14px;
  }
  th:nth-child(1),td:nth-child(1){width:34%}
  th:nth-child(2),td:nth-child(2){width:30%}
  th:nth-child(3),td:nth-child(3){width:16%}
  th:nth-child(4),td:nth-child(4){width:10%}
  th:nth-child(5),td:nth-child(5){width:10%}
  th,td{
    padding:8px 4px;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.35;
  }
}
</style>
</head>

</div>
<div id="meaning" class="meaning"></div>

<div class="controls">
  <button class="btn prev" onclick="prevWord()">上一页</button>

</div>

<div class="footer">

    <button onclick="exportProgress()">📤 导出进度</button>
    <button onclick="importProgress()">📥 导入进度</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
</div>

</div>
</div>

<!-- ===== 悬浮窗 ===== -->
<div id="modal" class="modal" onclick="closeModal(event)">

    <table>

          <th>备注</th>
          <th>不认识</th>
          <th>认识</th>
        </tr>
      </thead>
      <tbody id="wordTable"></tbody>
    </table>
  </div>
</div>

const MASTER_THRESHOLD=3;
const REVIEW_GAPS=[3,8,25];
const REVIEW_MIX_MIN=15;
const REVIEW_MIX_MAX=25;

let history=JSON.parse(localStorage.getItem("history")||"[]");
let currentRound=Number(localStorage.getItem("reviewRound"))||0;
const storedSinceLastMasteredReview=localStorage.getItem("sinceLastMasteredReview");
const storedNextMasteredReviewAt=localStorage.getItem("nextMasteredReviewAt");
let sinceLastMasteredReview=storedSinceLastMasteredReview===null?REVIEW_MIX_MIN:Number(storedSinceLastMasteredReview)||0;
let nextMasteredReviewAt=storedNextMasteredReviewAt===null?REVIEW_MIX_MIN:Number(storedNextMasteredReviewAt)||randomReviewInterval();
let currentIndex=Number(localStorage.getItem("currentIndex"))||0;
let saved=JSON.parse(localStorage.getItem("progress")||"null");
let modalMode="all";
let wordSplit=false;
let renderedWordIndex=null;

function randomReviewInterval(){
  return REVIEW_MIX_MIN+Math.floor(Math.random()*(REVIEW_MIX_MAX-REVIEW_MIX_MIN+1));
}

function normalizeWord(w){
  w.known=Number(w.known)||0;
  w.unknown=Number(w.unknown)||0;
  const knownStreak=Number(w.knownStreak);
  w.knownStreak=Number.isFinite(knownStreak)?knownStreak:Math.min(w.known,MASTER_THRESHOLD);
  w.mastered=typeof w.mastered==="boolean"?w.mastered:w.knownStreak>=MASTER_THRESHOLD||w.known>=MASTER_THRESHOLD;
  w.lastSeen=Number.isFinite(Number(w.lastSeen))?Number(w.lastSeen):-1;
  w.nextReview=Number.isFinite(Number(w.nextReview))?Number(w.nextReview):0;
}

if(saved){
  saved.forEach((s,i)=>{
    if(words[i]){
      words[i].known=s.known;
      words[i].unknown=s.unknown;
      words[i].knownStreak=s.knownStreak;
      words[i].mastered=s.mastered;
      words[i].lastSeen=s.lastSeen;
      words[i].nextReview=s.nextReview;
    }
  });
}

words.forEach(normalizeWord);

function render(){
  const w=words[currentIndex];
  if(renderedWordIndex!==currentIndex){
    wordSplit=false;
    renderedWordIndex=currentIndex;
  }
  document.getElementById("stat").innerText=`不认识 ${w.unknown} 次 ｜ 连续认识 ${w.knownStreak}/${MASTER_THRESHOLD} ｜ ${w.mastered?"已背":"复习中"}`;
  renderWordDisplay(w.word);
  document.getElementById("phoneticText").innerText=wordToPhonetic(w.word);
  document.getElementById("meaning").innerText=w.meaning;
  document.getElementById("note").innerHTML=`<span>备注：${w.subject}</span>`;
  document.getElementById("todo").innerText=words.filter(w=>!w.mastered).length;
  document.getElementById("done").innerText=words.filter(w=>w.mastered).length;
  save();
}

function toggleWordSplit(){
  wordSplit=!wordSplit;
  renderWordDisplay(words[currentIndex].word);
}

function renderWordDisplay(text){
  const wordEl=document.getElementById("word");
  wordEl.innerHTML="";
  wordEl.classList.toggle("split",wordSplit);
  if(!wordSplit){
    wordEl.textContent=text;
    return;
  }
  const fragment=document.createDocumentFragment();
  splitTextForStudy(text).forEach(part=>{
    if(part.type==="space"){
      const gap=document.createElement("span");
      gap.className="word-gap";
      gap.textContent=" ";
      fragment.appendChild(gap);
      return;
    }
    if(part.type==="punct"){
      fragment.appendChild(document.createTextNode(part.text));
      return;
    }
    const token=document.createElement("span");
    token.className="word-token";
    part.chunks.forEach((chunk,index)=>{
      const chunkSpan=document.createElement("span");
      chunkSpan.className=part.mode==="phoneme"?"phoneme":"syllable";
      chunkSpan.style.animationDelay=`${Math.min(index*25,180)}ms`;
      colorizeLetters(chunk,chunkSpan);
      token.appendChild(chunkSpan);
    });
    fragment.appendChild(token);
  });
  wordEl.appendChild(fragment);
}

function splitTextForStudy(text){
  return (text.match(/[A-Za-z]+|\s+|[^A-Za-z\s]+/g)||[]).map(part=>{
    if(/^\s+$/.test(part)) return {type:"space",text:part};
    if(!/[A-Za-z]/.test(part)) return {type:"punct",text:part};
    const syllables=syllabifyWord(part);
    if(syllables.length<=1){
      return {type:"word",mode:"phoneme",chunks:phonemeChunks(part)};
    }
    return {type:"word",mode:"syllable",chunks:syllables};
  });
}

function colorizeLetters(text,parent){
  [...text].forEach(ch=>{
    const span=document.createElement("span");
    span.textContent=ch;
    if(/[aeiouy]/i.test(ch)) span.className="letter-vowel";
    else if(/[a-z]/i.test(ch)) span.className="letter-consonant";
    parent.appendChild(span);
  });
}

function syllabifyWord(word){
  const lower=word.toLowerCase();
  const exceptions={
    alveolar:["al","ve","o","lar"], anatomical:["an","a","tom","i","cal"],
    artery:["ar","ter","y"], canal:["ca","nal"], cervical:["cer","vi","cal"], condylar:["con","dy","lar"],
    dental:["den","tal"], denture:["den","ture"], developmental:["de","vel","op","men","tal"],
    genial:["ge","ni","al"], gingival:["gin","gi","val"], implant:["im","plant"],
    incisal:["in","ci","sal"], lateral:["lat","er","al"], lower:["low","er"],
    mandibular:["man","dib","u","lar"], maxillary:["max","il","lar","y"], medial:["me","di","al"],
    occlusion:["oc","clu","sion"], occlusal:["oc","clu","sal"], palatine:["pal","a","tine"],
    periodontal:["per","i","o","don","tal"], prosthesis:["pros","the","sis"],
    prosthetic:["pros","thet","ic"], pterygoid:["pter","y","goid"], temporal:["tem","po","ral"],
    tubercles:["tu","ber","cles"], upper:["up","per"], vestibular:["ves","tib","u","lar"],
    zygomatic:["zy","go","mat","ic"]
  };
  if(exceptions[lower]) return matchCaseChunks(word,exceptions[lower]);
  const vowelGroups=[...lower.matchAll(/[aeiouy]+/g)];
  if(vowelGroups.length<=1) return [word];
  const cuts=[];
  for(let i=0;i<vowelGroups.length-1;i++){
    const currentEnd=vowelGroups[i].index+vowelGroups[i][0].length;
    const nextStart=vowelGroups[i+1].index;
    const between=lower.slice(currentEnd,nextStart);
    let cut;
    if(between.length===0) cut=currentEnd;
    else if(between.length===1) cut=currentEnd;
    else if(canSplitBeforeLastConsonant(between)) cut=nextStart-1;
    else cut=currentEnd+1;
    cuts.push(cut);
  }
  const chunks=[];
  let start=0;
  cuts.forEach(cut=>{
    chunks.push(word.slice(start,cut));
    start=cut;
  });
  chunks.push(word.slice(start));
  return chunks.filter(Boolean);
}

function canSplitBeforeLastConsonant(group){
  return !/(ch|sh|th|ph|ck|ng|qu|wr|kn|gn)$/.test(group);
}

function matchCaseChunks(original,chunks){
  let offset=0;
  return chunks.map(chunk=>{
    const piece=original.slice(offset,offset+chunk.length);
    offset+=chunk.length;
    return piece||chunk;
  });
}

function phonemeChunks(word){
  const chunks=[];
  const pattern=/ch|sh|th|ph|ck|ng|qu|wr|kn|gn|[aeiouy]+|[bcdfghjklmnpqrstvwxz]/ig;
  let match;
  while((match=pattern.exec(word))!==null){
    chunks.push(match[0]);
  }
  return chunks.length?chunks:[word];
}

function markKnown(){
  const w=words[currentIndex];
  const wasMastered=w.mastered;
  currentRound++;
  history.push(currentIndex);
  w.known++;
  w.knownStreak++;
  w.lastSeen=currentRound;
  w.mastered=w.knownStreak>=MASTER_THRESHOLD;
  w.nextReview=currentRound+(w.mastered?REVIEW_GAPS[2]:REVIEW_GAPS[Math.min(w.knownStreak-1,1)]);
  updateReviewMix(wasMastered);
  pickNext();
  render();
}

function markUnknown(){
  const w=words[currentIndex];
  const wasMastered=w.mastered;
  currentRound++;
  history.push(currentIndex);
  w.unknown++;
  w.knownStreak=0;
  w.mastered=false;
  w.lastSeen=currentRound;
  w.nextReview=currentRound+2+Math.floor(Math.random()*3);
  updateReviewMix(wasMastered);
  pickNext();
  render();
}

function updateReviewMix(wasMastered){
  if(wasMastered){
    sinceLastMasteredReview=0;
    nextMasteredReviewAt=randomReviewInterval();
  }else{
    sinceLastMasteredReview++;
  }
}

function prevWord(){
  const previous=history.pop();
  if(Number.isInteger(previous)){
    currentIndex=previous;
    render();
  }
}

function pickNext(){
  const chooseWeighted=(candidates)=>{
    const weighted=candidates.map(i=>{
      const w=words[i];
      const spacing=Math.max(0,currentRound-w.lastSeen);
      const score=1+(w.unknown*3)+(w.mastered?0.25:2)+(spacing/12);
      return {i,score};
    });
    const total=weighted.reduce((sum,item)=>sum+item.score,0);
    let roll=Math.random()*total;
    for(const item of weighted){
      roll-=item.score;
      if(roll<=0) return item.i;
    }
    return weighted[weighted.length-1].i;
  };

  const notCurrent=(w,i)=>i!==currentIndex;
  const due=words
    .map((w,i)=>({w,i}))
    .filter(({w,i})=>notCurrent(w,i)&&w.nextReview<=currentRound);
  const newWords=due.filter(({w})=>!w.mastered&&w.known===0&&w.unknown===0).map(({i})=>i);
  const learning=due.filter(({w})=>!w.mastered&&(w.known>0||w.unknown>0)).map(({i})=>i);
  const masteredDue=due.filter(({w})=>w.mastered).map(({i})=>i);
  const masteredPool=words
    .map((w,i)=>({w,i}))
    .filter(({w,i})=>notCurrent(w,i)&&w.mastered)
    .map(({i})=>i);

  if(masteredPool.length&&sinceLastMasteredReview>=nextMasteredReviewAt){
    currentIndex=chooseWeighted(masteredDue.length?masteredDue:masteredPool);
  }else if(learning.length) currentIndex=chooseWeighted(learning);
  else if(newWords.length) currentIndex=chooseWeighted(newWords);
  else if(masteredDue.length) currentIndex=chooseWeighted(masteredDue);
  else {
    const reviewPool=words
      .map((w,i)=>({w,i}))
      .filter(({w,i})=>notCurrent(w,i)&&(!w.mastered||currentRound%18===0))
      .map(({i})=>i);
    currentIndex=chooseWeighted(reviewPool.length?reviewPool:words.map((_,i)=>i).filter(i=>i!==currentIndex));
  }
}

function speak(){
  const u=new SpeechSynthesisUtterance(words[currentIndex].word);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

function wordToPhonetic(text){
  const dictionary={
    alveolar:"ælˈviːələr", anatomical:"ˌænəˈtɑːmɪkəl", artery:"ˈɑːrtəri",
    bite:"baɪt", bone:"boʊn", canal:"kəˈnæl", canine:"ˈkeɪnaɪn",
    cement:"sɪˈment", cervical:"ˈsɜːrvɪkəl", clasp:"klæsp",
    condyle:"ˈkɑːndaɪl", condylar:"ˈkɑːndɪlər", crown:"kraʊn",
    curve:"kɜːrv", dental:"ˈdentəl", denture:"ˈdentʃər", foramen:"fəˈreɪmən",
    fossa:"ˈfɑːsə", gingival:"ˈdʒɪndʒɪvəl", gland:"ɡlænd",
    implant:"ˈɪmplænt", incisal:"ɪnˈsaɪzəl", incisor:"ɪnˈsaɪzər",
    labial:"ˈleɪbiəl", lateral:"ˈlætərəl", ligament:"ˈlɪɡəmənt",
    lingual:"ˈlɪŋɡwəl", mandibular:"mænˈdɪbjələr", maxilla:"mækˈsɪlə",
    maxillary:"ˈmæksəˌleri", mucosa:"mjuːˈkoʊsə", muscle:"ˈmʌsəl",
    nasal:"ˈneɪzəl", nerve:"nɜːrv", occlusion:"əˈkluːʒən",
    occlusal:"əˈkluːzəl", palate:"ˈpælət", palatal:"ˈpælətəl",
    palatine:"ˈpælətaɪn", periodontal:"ˌperiəˈdɑːntəl", prosthesis:"prɑːsˈθiːsɪs",
    prosthetic:"prɑːsˈθetɪk", pterygoid:"ˈterɪɡɔɪd", ridge:"rɪdʒ",
    splint:"splɪnt", surface:"ˈsɜːrfɪs", temporal:"ˈtempərəl",
    tooth:"tuːθ", vestibular:"veˈstɪbjələr", zygomatic:"ˌzaɪɡəˈmætɪk"
  };
  return "/" + text
    .toLowerCase()
    .replace(/[()]/g,"")
    .split(/([\s,-]+)/)
    .map(part=>{
      if(!/[a-z]/.test(part)) return part;
      const clean=part.replace(/[^a-z]/g,"");
      return dictionary[clean]||roughPhonetic(clean);
    })
    .join("")
    .replace(/\s+/g," ")
    .trim() + "/";
}

function roughPhonetic(word){
  return word
    .replace(/tion$/,"ʃən")
    .replace(/sion$/,"ʒən")
    .replace(/ph/g,"f")
    .replace(/ch/g,"tʃ")
    .replace(/sh/g,"ʃ")
    .replace(/th/g,"θ")
    .replace(/ck/g,"k")
    .replace(/qu/g,"kw")
    .replace(/x/g,"ks")
    .replace(/c(?=[eiy])/g,"s")
    .replace(/c/g,"k")
    .replace(/g(?=[eiy])/g,"dʒ")
    .replace(/a/g,"æ")
    .replace(/e/g,"e")
    .replace(/i/g,"ɪ")
    .replace(/o/g,"ɑ")
    .replace(/u/g,"ʌ");
}

function save(){
  localStorage.setItem("currentIndex",currentIndex);
  localStorage.setItem("reviewRound",currentRound);
  localStorage.setItem("sinceLastMasteredReview",sinceLastMasteredReview);
  localStorage.setItem("nextMasteredReviewAt",nextMasteredReviewAt);
  localStorage.setItem("history",JSON.stringify(history.slice(-80)));
  localStorage.setItem("progress",JSON.stringify(words.map(w=>({
    known:w.known,
    unknown:w.unknown,
    knownStreak:w.knownStreak,
    mastered:w.mastered,
    lastSeen:w.lastSeen,
    nextReview:w.nextReview
  }))));
}

/* ===== 悬浮窗逻辑 ===== */
function openModal(mode="all"){
  modalMode=mode;
  document.getElementById("modalTitle").innerText=mode==="mastered"?"✅ 已背单词一览":"📘 全部单词一览（A–Z）";
  document.getElementById("wordSearch").value="";
  document.getElementById("modal").style.display="flex";
  renderWordTable();
}

function renderWordTable(){
  const tbody=document.getElementById("wordTable");
  const keyword=document.getElementById("wordSearch").value.trim().toLowerCase();
  tbody.innerHTML="";
  const fragment=document.createDocumentFragment();
  words
    .filter(w=>modalMode!=="mastered"||w.mastered)
    .filter(w=>{
      if(!keyword) return true;
      return [w.word,w.meaning,w.subject].some(text=>String(text).toLowerCase().includes(keyword));
    })
    .sort((a,b)=>a.word.localeCompare(b.word))
    .forEach(w=>{
    const tr=document.createElement("tr");
    [
      {text:w.word,className:"en"},
      {text:w.meaning,className:"cn"},
      {text:w.subject},
      {text:w.unknown},
      {text:w.known}
    ].forEach(cell=>{
      const td=document.createElement("td");
      td.innerText=cell.text;
      if(cell.className) td.className=cell.className;
      tr.appendChild(td);
    });
    fragment.appendChild(tr);
  });
  tbody.appendChild(fragment);
}
function closeModal(e){
  if(!e || e.target.id==="modal"){
    document.getElementById("modal").style.display="none";
  }
}

function exportProgress(){
  const blob=new Blob([JSON.stringify({words,currentIndex,currentRound,sinceLastMasteredReview,nextMasteredReviewAt},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="oral_professional_english_progress.json";
  a.click();
}

function importProgress(){
  document.getElementById("importFile").click();
}

document.getElementById("importFile").addEventListener("change",e=>{
  const r=new FileReader();
  r.onload=()=>{
    const d=JSON.parse(r.result);
    d.words.forEach((w,i)=>{
      if(words[i]){
        words[i].known=w.known;
        words[i].unknown=w.unknown;
        words[i].knownStreak=w.knownStreak;
        words[i].mastered=w.mastered;
        words[i].lastSeen=w.lastSeen;
        words[i].nextReview=w.nextReview;
        normalizeWord(words[i]);
      }
    });
    currentIndex=d.currentIndex||0;
    currentRound=d.currentRound||currentRound;
    sinceLastMasteredReview=Number(d.sinceLastMasteredReview)||0;
    nextMasteredReviewAt=Number(d.nextMasteredReviewAt)||randomReviewInterval();
    save();render();
  };
  r.readAsText(e.target.files[0]);
});

pickNext();
render();
</script>
