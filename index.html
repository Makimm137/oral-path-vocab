<style>
:root{

  --text:#1d1d1f;

}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#f4f8fb 0%,var(--bg) 52%,#f7f7f9 100%);

}
.container{max-width:900px;margin:0 auto;padding:20px}
.card{
  background:var(--card);
  border:1px solid rgba(0,0,0,.04);
  border-radius:24px;
  padding:34px 28px;
  box-shadow:0 18px 45px rgba(20,42,70,.10);
}

.stat{
  text-align:center;
  font-size:18px;
  color:var(--sub);
  margin-bottom:8px;
}

.word{
  font-family:"Times New Roman",serif;
  font-size:72px;
  text-align:center;
}
.phonetic{
  font-family:"Times New Roman",serif;
  font-size:32px;
  text-align:center;
  color:var(--sub);
}
.meaning{
  margin-top:26px;
  font-size:32px;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  text-align:center;
  background:#fafafa;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}
.note{
  margin-top:14px;
  text-align:center;
  color:var(--sub);
  font-size:17px;
}
.note span{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:4px 12px;
  border-radius:999px;
  background:var(--soft);
  color:#0b5cad;
}
.controls{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:32px;
}
.btn{
  min-width:120px;
  padding:14px 22px;
  border-radius:18px;
  font-size:18px;
  border:none;
  cursor:pointer;
}
.prev{background:#e5e5ea}
.unknown{background:#ff9f0a;color:#fff}
.known{background:#007aff;color:#fff}

.footer{
  margin-top:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  color:#6e6e73;
}

/* ===== 悬浮窗 ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.modal-content{
  background:#fff;
  width:90%;
  max-width:900px;
  max-height:80vh;
  overflow:auto;
  border-radius:20px;
  padding:20px;
}
.modal h2{
  margin:0 0 12px;
  text-align:center;
}
.close{
  position:sticky;
  top:0;
  float:right;
  cursor:pointer;
  font-size:18px;
}

/* ===== 表格 ===== */
table{
  width:100%;
  border-collapse:collapse;
  font-size:16px;
}
th,td{
  padding:8px 10px;
  border-bottom:1px solid #eee;
  text-align:center;
}
th{
  background:#fafafa;
}
td.en{
  font-family:"Times New Roman",serif;
}
td.cn{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
}

@media(max-width:600px){
  .word{font-size:52px}
  .meaning{font-size:26px}
}
</style>
</head>

let history=[];
let currentIndex=Number(localStorage.getItem("currentIndex"))||0;
let saved=JSON.parse(localStorage.getItem("progress")||"null");

if(saved){
  saved.forEach((s,i)=>{
    if(words[i]){
      words[i].known=s.known;
      words[i].unknown=s.unknown;
    }
  });
}

function render(){
  const w=words[currentIndex];
  document.getElementById("stat").innerText=`不认识 ${w.unknown} 次 ｜ 认识 ${w.known} 次`;
  document.getElementById("word").innerText=w.word;
  document.getElementById("meaning").innerText=w.meaning;
  document.getElementById("note").innerHTML=`<span>备注：${w.subject}</span>`;
  document.getElementById("todo").innerText=words.filter(w=>w.known<3).length;
  document.getElementById("done").innerText=words.filter(w=>w.known>=3).length;
  save();
}

function markKnown(){words[currentIndex].known++;pickNext();render();}
function markUnknown(){words[currentIndex].unknown++;pickNext();render();}

function pickNext(){
  currentIndex=Math.floor(Math.random()*words.length);
}

function speak(){
  const u=new SpeechSynthesisUtterance(words[currentIndex].word);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

function save(){
  localStorage.setItem("currentIndex",currentIndex);
  localStorage.setItem("progress",JSON.stringify(words.map(w=>({known:w.known,unknown:w.unknown}))));
}

/* ===== 悬浮窗逻辑 ===== */
function openModal(){
  document.getElementById("modal").style.display="flex";
  const tbody=document.getElementById("wordTable");
  tbody.innerHTML="";
  const fragment=document.createDocumentFragment();
  [...words].sort((a,b)=>a.word.localeCompare(b.word)).forEach(w=>{
    const tr=document.createElement("tr");
    [
      {text:w.word,className:"en"},
      {text:w.meaning,className:"cn"},
      {text:w.subject},
      {text:w.unknown},
      {text:w.known}
    ].forEach(cell=>{
      const td=document.createElement("td");
      td.innerText=cell.text;
      if(cell.className) td.className=cell.className;
      tr.appendChild(td);
    });
    fragment.appendChild(tr);
  });
  tbody.appendChild(fragment);
}
function closeModal(e){
  if(!e || e.target.id==="modal"){
    document.getElementById("modal").style.display="none";
  }
}

function exportProgress(){
  const blob=new Blob([JSON.stringify({words,currentIndex},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="oral_professional_english_progress.json";
  a.click();
}

function importProgress(){
  document.getElementById("importFile").click();
}

document.getElementById("importFile").addEventListener("change",e=>{
  const r=new FileReader();
  r.onload=()=>{
    const d=JSON.parse(r.result);
    d.words.forEach((w,i)=>{
      if(words[i]){
        words[i].known=w.known;
        words[i].unknown=w.unknown;
      }
    });
    currentIndex=d.currentIndex||0;
    save();render();
  };
  r.readAsText(e.target.files[0]);
});

pickNext();
render();
</script>
